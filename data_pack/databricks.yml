# This is a Declarative Automation Bundle definition for data_pack.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: data_pack
  uuid: 8bbf7c7a-f1af-428c-b6c3-93693e93a11d

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606750542306.6.azuredatabricks.net
    variables:
      catalog: mydataproject
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405606750542306.6.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/revankarrohan@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/revankarrohan@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mydataproject
      schema: prod
    permissions:
      - user_name: revankarrohan@outlook.com
        level: CAN_MANAGE
