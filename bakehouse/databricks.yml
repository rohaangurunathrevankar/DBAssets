# This is a Declarative Automation Bundle definition for bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse
  uuid: 15eccce3-7f4d-4d1a-8e8b-5726cd46f794

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606750542306.6.azuredatabricks.net
    variables:
      catalog: bakehouse_analytics
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405606750542306.6.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/revankarrohan@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/revankarrohan@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics
      schema: prod
    permissions:
      - user_name: revankarrohan@outlook.com
        level: CAN_MANAGE
